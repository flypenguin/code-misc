version: '3'
services:

  grav:
    image: shinsenter/grav:latest
    volumes:
      - ./data/grav:/var/www/html
      - ./data/certs:/etc/ssl/web
    environment:
      TZ: Europe/Berlin
      PUID: ${UID:-9999}
      PGID: ${GID:-9999}
    ports:
      - "8080:80"
      - "8443:443"


  ## OTHER CONTAINERS SUCH AS REDIS OR DATABASE ###################################

  db:
    image: mariadb:latest
    environment:
      TZ: UTC
      MYSQL_ROOT_PASSWORD: grav
      MYSQL_DATABASE: grav
    volumes:
      - "./data/db/data:/var/lib/mysql"
      - "./data/db/dump:/docker-entrypoint-initdb.d"
    ports:
      - "3306:3306"

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

